<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đang đăng nhập Zalo...</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #0f172a;
    }

    .box {
      width: min(420px, calc(100% - 32px));
      background: #fff;
      border-radius: 18px;
      padding: 28px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(15, 23, 42, .12);
    }

    .spinner {
      width: 42px;
      height: 42px;
      margin: 0 auto 18px;
      border: 4px solid #dbeafe;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    h1 {
      font-size: 20px;
      margin: 0 0 8px;
    }

    p {
      margin: 0;
      color: #64748b;
      line-height: 1.5;
    }

    a {
      display: inline-block;
      margin-top: 18px;
      color: #2563eb;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="spinner" id="spinner"></div>
    <h1 id="title">Đang xác thực Zalo...</h1>
    <p id="message">Vui lòng chờ trong giây lát.</p>
    <a id="back" href="/" style="display:none">Quay lại Abraham Bike</a>
  </div>

  <script>
    (async function () {
      const params = new URLSearchParams(location.search);

      const code = params.get("code");
      const state = params.get("state");
      const error = params.get("error");

      const title = document.getElementById("title");
      const message = document.getElementById("message");
      const spinner = document.getElementById("spinner");
      const back = document.getElementById("back");

      function showError(text) {
        spinner.style.display = "none";
        title.textContent = "Đăng nhập Zalo chưa thành công";
        message.textContent = text;
        back.style.display = "";
      }

      if (error) {
        showError("Bạn đã hủy hoặc Zalo từ chối yêu cầu đăng nhập.");
        return;
      }

      if (!code || !state) {
        showError("Thiếu mã xác thực từ Zalo.");
        return;
      }

      try {
        const url =
          "/api/zalo-callback?code=" +
          encodeURIComponent(code) +
          "&state=" +
          encodeURIComponent(state);

        const response = await fetch(url, {
          method: "GET",
          credentials: "same-origin"
        });

        const data = await response.json();

        if (!response.ok || !data.ok) {
          throw new Error(
            data.message || "Không xác thực được tài khoản Zalo."
          );
        }

        title.textContent = "Đăng nhập thành công";
        message.textContent =
          "Xin chào " +
          (data.user.name || "bạn") +
          ". Đang quay lại Abraham Bike...";

        setTimeout(function () {
          location.replace("/?zalo=success");
        }, 800);
      } catch (err) {
        console.error(err);
        showError(err.message || "Có lỗi khi đăng nhập Zalo.");
      }
    })();
  </script>
</body>
</html>
